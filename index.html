<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cave Homes Spain</title>

<style>

</head>:root{
  --ink:#2f241e;
  --muted:#75675d;
  --paper:#f8f3ec;
  --card:#ffffff;
  --accent:#9a5b32;
  --accent-dark:#70401f;
  --sand:#ead8c2;
  --line:#e3d4c3;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--ink);
}

header{
  padding:16px 6vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  background:#fff;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:25px;
  font-weight:800;
  color:var(--ink);
}

.tag{color:var(--accent)}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:var(--ink);
  font-weight:700;
  text-decoration:none;
  font-size:16px;
}

nav a:hover{
  color:var(--accent);
}

.hero{
  min-height:560px;
  padding:90px 6vw;
  display:flex;
  align-items:center;
  background:
    linear-gradient(135deg,rgba(248,243,236,.96),rgba(234,216,194,.88));
}

.hero h1{
  font-size:clamp(42px,7vw,72px);
  line-height:1.02;
  max-width:780px;
  margin:0 0 22px;
  letter-spacing:-2px;
}

.hero p{
  max-width:700px;
  color:var(--muted);
  font-size:20px;
  line-height:1.6;
  margin:0 0 30px;
}

.search{
  max-width:950px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
  background:#fff;
  padding:22px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(60,40,20,.14);
}

.search input,
.search select{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  font-size:16px;
}

.search button,
.cta{
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  padding:14px 22px;
  font-weight:800;
  cursor:pointer;
}

.search button:hover,
.cta:hover{
  background:var(--accent-dark);
}

main{
  padding:60px 6vw;
}

section{
  scroll-margin-top:90px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:25px;
}

.section-head h2{
  font-size:32px;
  margin:0;
}

.muted{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:25px;
  margin-top:25px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(60,40,20,.08);
  transition:transform .2s,box-shadow .2s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 14px 35px rgba(60,40,20,.15);
}

.photo{
  height:220px;
  display:flex;
  align-items:end;
  padding:18px;
  color:#fff;
  font-weight:800;
  font-size:18px;
}

.photo.one{
  background:linear-gradient(135deg,#9b6b4b,#d9b18d);
}

.photo.two{
  background:linear-gradient(135deg,#66745b,#c1aa86);
}

.photo.three{
  background:linear-gradient(135deg,#7b6658,#d0ad8c);
}

.card-body{
  padding:20px;
}

.card-body h3{
  font-size:24px;
  margin:0 0 10px;
}

.price{
  font-size:25px;
  font-weight:800;
  margin-top:16px;
}

.facts{
  color:var(--muted);
  margin:10px 0 16px;
}

.card button{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  font-weight:700;
}

.card button:hover{
  background:var(--sand);
}

.contact{
  background:var(--sand);
  padding:40px;
  border-radius:22px;
  margin-top:40px;
}

.contact h2{
  font-size:32px;
  margin-top:0;
}

form{
  max-width:650px;
}

label{
  display:block;
  font-weight:700;
  margin:18px 0 7px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  font:inherit;
  background:#fff;
}

textarea{
  resize:vertical;
}

form button{
  margin-top:20px;
  background:var(--accent);
  color:#fff;
  border:0;
  padding:14px 24px;
  border-radius:10px;
  font-weight:800;
}

footer{
  background:#30251f;
  color:#fff;
  padding:35px 6vw;
  text-align:center;
}

@media(max-width:700px){
  header{
    padding:14px 5vw;
  }

  .brand{
    font-size:21px;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:15px;
  }

  .hero{
    min-height:500px;
    padding:60px 5vw;
  }

  .hero h1{
    font-size:43px;
    letter-spacing:-1px;
  }

  .hero p{
    font-size:18px;
  }

  .search{
    grid-template-columns:1fr;
    padding:18px;
  }

  main{
    padding:45px 5vw;
  }

  .section-head{
    display:block;
  }

  .contact{
    padding:28px 22px;
  }
}

<body>

<header>
  <div class="brand">🏡 <span class="tag">Cave Homes</span> Spain</div>

  <nav>
  <a href="#properties">Buy</a>
  <a href="#sell">Sell</a>
  <a href="#contact">Contact</a>
</nav>
</header>
<section class="hero">
  <h1>Find your own cave home in Spain.</h1>
  <p>
    Authentic cave houses, rural retreats and investment
    opportunities across Andalucía and beyond.
  </p>

  <div class="search">
    <input id="town" placeholder="Town or province">

    <select id="price">
      <option value="0">Any price</option>
      <option value="100000">Up to €100,000</option>
      <option value="150000">Up to €150,000</option>
      <option value="200000">Up to €200,000</option>
    </select>

    <select id="beds">
      <option value="0">Any bedrooms</option>
      <option value="2">2+ bedrooms</option>
      <option value="3">3+ bedrooms</option>
      <option value="4">4+ bedrooms</option>
      <option value="5">5+ bedrooms</option>
    </select>

    <button onclick="searchHomes()">Search</button>
  </div>

  <div id="resultsMessage"></div>
</section>

<main>

<section id="properties">
  <div class="section-head">
    <div>
      <h2>Featured cave homes</h2>
      <p class="muted">Explore
 our featured cave homes in Spain.</p>
</div>

<div class="features">
  <div class="feature">
    <h3>Andalusian Cave Home</h3>
    <p>Galera, Granada</p>
    <strong>€80,000</strong>
  </div>

  <div class="feature">
    <h3>Renovated Cave Retreat</h3>
    <p>Galera, Granada</p>
    <strong>€135,000</strong>
  </div>

  <div class="feature">
    <h3>Luxury Cave House</h3>
    <p>Galera, Granada</p>
    <strong>€189,000</strong>
  </div>
</div>
</section>

  <section id="sell" class="contact">
  <h2>Sell your cave home</h2>
  <p>Want to sell your cave home in Spain? Get in touch with us.</p>
  <p>Email: hello@cavehomesspain.com</p>
</section>

<section id="contact" class="contact">
  <h2>Contact Cave Homes Spain</h2>
  <p>Tell us what you're looking for.</p>

  <form action="mailto:hello@cavehomesspain.com" method="post" enctype="text/plain">
    <label for="name">Name</label>
    <input type="text" id="name" name="Name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="Email" required>

    <label for="message">Message</label>
    <textarea id="message" name="Message" rows="6" required></textarea>

    <button type="submit">Send enquiry</button>
  </form>
</section>

</main>

<footer>
  Cave Homes Spain — Authentic cave homes in Spain.
</footer>

<script>
function goTo(id) {
  const section = document.getElementById(id);

  if (section) {
    section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}

function searchHomes() {
  const town = document.getElementById("town").value.trim();
  const price = document.getElementById("price").value;
  const beds = document.getElementById("beds").value;
  const message = document.getElementById("resultsMessage");

  if (!town && price === "0" && beds === "0") {
    message.textContent = "Showing all available cave homes.";
  } else {
    message.textContent = "Searching for cave homes matching your criteria...";
  }

  goTo("properties");
}
</script>

</body>
</html>
