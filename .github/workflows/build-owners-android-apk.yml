name: Build Cave Homes Spain Owners APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'owners-android-app/**'
      - '.github/workflows/build-owners-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owners-android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android launcher icon resources
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp app/src/main/res/drawable/app_icon.png app/src/main/res/mipmap-$density/ic_launcher.png
            cp app/src/main/res/drawable/app_icon.png app/src/main/res/mipmap-$density/ic_launcher_round.png
          done
      - name: Build Owners APK
        run: gradle assembleDebug
      - name: Publish Owners APK to website
        working-directory: .
        run: |
          mkdir -p downloads
          cp owners-android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Cave-Homes-Spain-Owners.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Cave-Homes-Spain-Owners.apk
          git commit -m "Publish Cave Homes Spain Owners Android APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Cave-Homes-Spain-Owners-Android
          path: owners-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
