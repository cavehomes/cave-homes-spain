name: Build Cave Homes Spain APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android launcher icon resources
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-mdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-hdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-mdpi/ic_launcher_round.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-hdpi/ic_launcher_round.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xhdpi/ic_launcher_round.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xxhdpi/ic_launcher_round.jpg
          cp app/src/main/res/drawable/app_icon.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg
      - name: Build APK
        run: gradle assembleDebug
      - name: Publish APK to website
        working-directory: .
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Cave-Homes-Spain.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Cave-Homes-Spain.apk
          git commit -m "Publish latest Cave Homes Spain Android APK" || exit 0
          git push
      - name: Rename APK for build artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Cave-Homes-Spain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cave-Homes-Spain-Android
          path: Cave-Homes-Spain.apk
          retention-days: 30
