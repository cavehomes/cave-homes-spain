<style>
:root{--green:#183d32;--clay:#b76443;--cream:#f7f2e9;--ink:#24352f;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{background:white;border-bottom:1px solid var(--line);padding:14px 0}.head,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font:700 20px Georgia,serif;text-decoration:none;color:var(--green)}.brand img{width:64px}main{padding:28px 0 48px}h1{font:700 clamp(32px,5vw,48px) Georgia,serif;color:var(--green);margin:16px 0}h2{font:700 25px Georgia,serif;color:var(--green)}a{color:var(--green)}button,select{font:inherit}button,.btn{border:1px solid var(--green);border-radius:24px;padding:10px 18px;cursor:pointer;background:white;color:var(--green);text-decoration:none;display:inline-block}.btn.primary{background:var(--green);color:white}.btn[hidden]{display:none}select{padding:10px;border:1px solid var(--line);border-radius:10px;background:white;max-width:100%}.chooser{background:white;border:1px solid var(--line);padding:20px;border-radius:16px;margin:24px 0}.chooser label{display:block;font-weight:700;margin-bottom:8px}.saved-list{display:flex;gap:10px;flex-wrap:wrap}.saved-list label{font-weight:400;background:var(--cream);padding:10px;border-radius:10px;display:flex;gap:8px;align-items:center}.saved-list input{width:20px;height:20px}#notice{min-height:24px}#comparisonScroll{overflow:auto;border-radius:16px;background:white;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{padding:16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th[scope=row]{width:160px;color:var(--green);font-size:14px}thead th{font-weight:400}thead img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px}thead h2{font-size:22px;margin:12px 0}thead button{padding:6px 12px;font-size:14px}.empty{padding:28px}#count{font-weight:700}#hint{color:#54655d}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--clay);outline-offset:3px}@media(max-width:700px){.brand{font-size:17px}.brand img{width:48px}table{min-width:680px}th,td{padding:12px}th[scope=row]{width:120px}.actions .primary{width:100%;text-align:center}.chooser .actions select{width:100%}}
</style>

<body>
<header><div class="wrap head"><a class="brand" href="/"><img src="/cave-homes-spain-logo.png" alt="">Cave Homes Spain</a><select id="language" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="fr-BE">FR</option><option value="de">DE</option><option value="nl">NL</option></select></div></header>
<main class="wrap"><a id="back" href="/#buy">Browse properties</a><h1 id="heading">Compare properties</h1><p id="intro">Choose up to three homes to compare their published details.</p>
<div class="actions"><span id="count" aria-live="polite"></span><button id="clear" type="button">Clear</button><a id="enquire" class="btn primary" hidden>Ask about these homes</a></div>
<section class="chooser"><label for="picker" id="pickerLabel">Add a property</label><div class="actions"><select id="picker" disabled></select><button id="add" type="button" disabled>Add</button></div><h2 id="savedTitle">Your saved homes</h2><div id="savedList" class="saved-list"></div></section>
<p id="notice" role="status">Loading properties…</p><p id="hint"></p><div id="comparisonScroll" tabindex="0" aria-label="Property comparison"><div id="comparison"></div></div>
<noscript>Please enable JavaScript to compare properties.</noscript>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const copy={
en:['Compare properties','Choose up to three homes to compare their published details.','Browse properties','Add a property','Add','Your saved homes','Save homes using the heart on a property listing.','Clear','Ask about these homes','Loading properties…','Properties could not be loaded. Please try again.','Choose a property','You can compare up to three properties.','Not specified','Price','Location','Bedrooms','Property type','Condition','Outside space','Water and electricity','Listing notes','View property','Remove','homes selected','Swipe across the table to compare all homes.','Choose a home above to start comparing.','Details are taken from the published listing. Confirm utilities, condition and measurements before buying.'],
es:['Comparar propiedades','Elige hasta tres viviendas para comparar sus datos publicados.','Ver propiedades','Añadir una propiedad','Añadir','Tus propiedades guardadas','Guarda propiedades pulsando el corazón del anuncio.','Borrar','Consultar sobre estas propiedades','Cargando propiedades…','No se han podido cargar las propiedades. Inténtalo de nuevo.','Elige una propiedad','Puedes comparar hasta tres propiedades.','No especificado','Precio','Ubicación','Dormitorios','Tipo de propiedad','Estado','Espacio exterior','Agua y electricidad','Notas del anuncio','Ver propiedad','Quitar','propiedades seleccionadas','Desliza la tabla para comparar todas las propiedades.','Elige una propiedad arriba para empezar.','Los datos proceden del anuncio publicado. Confirma los suministros, el estado y las medidas antes de comprar.'],
'fr-BE':['Comparer les biens','Choisissez jusqu’à trois biens pour comparer les informations publiées.','Voir les biens','Ajouter un bien','Ajouter','Vos biens enregistrés','Enregistrez un bien avec le cœur de son annonce.','Effacer','Demander des informations sur ces biens','Chargement des biens…','Impossible de charger les biens. Réessayez.','Choisissez un bien','Vous pouvez comparer trois biens au maximum.','Non précisé','Prix','Localisation','Chambres','Type de bien','État','Espace extérieur','Eau et électricité','Notes de l’annonce','Voir le bien','Retirer','biens sélectionnés','Faites défiler le tableau pour comparer tous les biens.','Choisissez un bien ci-dessus pour commencer.','Les informations proviennent de l’annonce publiée. Confirmez les raccordements, l’état et les mesures avant l’achat.'],
de:['Immobilien vergleichen','Wählen Sie bis zu drei Immobilien und vergleichen Sie die veröffentlichten Angaben.','Immobilien ansehen','Immobilie hinzufügen','Hinzufügen','Ihre gespeicherten Immobilien','Speichern Sie Immobilien mit dem Herz in der Anzeige.','Leeren','Zu diesen Immobilien anfragen','Immobilien werden geladen…','Immobilien konnten nicht geladen werden. Bitte erneut versuchen.','Immobilie auswählen','Sie können bis zu drei Immobilien vergleichen.','Nicht angegeben','Preis','Ort','Schlafzimmer','Immobilientyp','Zustand','Außenbereich','Wasser und Strom','Angaben aus der Anzeige','Immobilie ansehen','Entfernen','Immobilien ausgewählt','Wischen Sie durch die Tabelle, um alle Immobilien zu vergleichen.','Wählen Sie oben eine Immobilie aus.','Die Angaben stammen aus der veröffentlichten Anzeige. Bestätigen Sie Anschlüsse, Zustand und Maße vor dem Kauf.'],
nl:['Woningen vergelijken','Kies maximaal drie woningen om de gepubliceerde gegevens te vergelijken.','Woningen bekijken','Woning toevoegen','Toevoegen','Uw opgeslagen woningen','Bewaar woningen met het hartje op de advertentie.','Wissen','Vraag naar deze woningen','Woningen laden…','De woningen konden niet worden geladen. Probeer opnieuw.','Kies een woning','U kunt maximaal drie woningen vergelijken.','Niet vermeld','Prijs','Locatie','Slaapkamers','Woningtype','Staat','Buitenruimte','Water en elektriciteit','Advertentietekst','Woning bekijken','Verwijderen','woningen geselecteerd','Veeg door de tabel om alle woningen te vergelijken.','Kies hierboven een woning om te beginnen.','De gegevens komen uit de gepubliceerde advertentie. Bevestig aansluitingen, staat en afmetingen voor aankoop.']};
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const read=(key)=>{try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'):[]}catch{return []}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=params.get('lang')||localStorage.getItem('caveHomesLanguageManual')||navigator.language;
lang=copy[lang]?lang:lang?.startsWith('fr')?'fr-BE':copy[lang?.slice(0,2)]?lang.slice(0,2):'en';
let homes=[],selected=[...new Set(read('caveComparedHomes'))].slice(0,3),loaded=false,failed=false;
const key=h=>String(h.id||h.title),homeCopy=h=>{const latest=window.CHSPropertyCopy?.[h.id];return latest?.source===h.description&&latest[lang]?latest[lang]:{title:h['title_'+lang]||h.title,description:h['description_'+lang]||h.description||''}};
function persist(){try{localStorage.setItem('caveComparedHomes',JSON.stringify(selected))}catch{}}
function excerpt(h,pattern){const text=homeCopy(h).description;return text.split(/(?<=[.!?])\s+|\n+/).filter(s=>pattern.test(s)).join(' ').slice(0,600)||copy[lang][13]}
function render(){const c=copy[lang];document.documentElement.lang=lang;$('language').value=lang;document.title=c[0]+' | Cave Homes Spain';
[['heading',0],['intro',1],['back',2],['pickerLabel',3],['add',4],['savedTitle',5],['clear',7],['enquire',8]].forEach(([id,i])=>$(id).textContent=c[i]);$('back').href='/?lang='+encodeURIComponent(lang)+'#buy';$('hint').textContent=c[25]+' '+c[27];$('count').textContent=selected.length+' / 3 '+c[24];
$('notice').textContent=failed?c[10]:loaded?'':c[9];$('add').disabled=!loaded||selected.length>=3;$('picker').disabled=!loaded;
$('picker').innerHTML='<option value="">'+esc(c[11])+'</option>'+homes.filter(h=>!selected.includes(key(h))).map(h=>'<option value="'+esc(key(h))+'">'+esc(homeCopy(h).title)+' · '+esc(h.town||'')+'</option>').join('');
const saved=read('caveSavedHomes');const savedHomes=homes.filter(h=>saved.includes(key(h))||saved.includes(h.title));$('savedList').innerHTML=savedHomes.length?savedHomes.map(h=>'<label><input type="checkbox" data-home="'+esc(key(h))+'" '+(selected.includes(key(h))?'checked':'')+' '+(selected.length>=3&&!selected.includes(key(h))?'disabled':'')+'>'+esc(homeCopy(h).title)+'</label>').join(''):'<p>'+esc(c[6])+'</p>';
const chosen=selected.map(id=>homes.find(h=>key(h)===id)).filter(Boolean);$('enquire').hidden=!chosen.length;
const url=new URL('/contact.html',location.origin);url.searchParams.set('lang',lang);url.searchParams.set('property',chosen.map(h=>h.title).join(' / '));url.searchParams.set('comparison',JSON.stringify(chosen.map(h=>({id:h.id,title:h.title}))));$('enquire').href=url.pathname+url.search;
if(!chosen.length){$('comparison').innerHTML='<p class="empty">'+esc(loaded?c[26]:c[9])+'</p>';return}
const fields=[h=>Number(h.price)>0?'€'+Number(h.price).toLocaleString(lang):c[13],h=>[h.town,h.province].filter(Boolean).join(', ')||c[13],h=>Number(h.bedrooms)>0?h.bedrooms:c[13],h=>h.property_type||c[13],h=>h.property_condition||h.condition||excerpt(h,/renovat|reform|restor|habit|move.in|renovier|rénov|bewoon/i),h=>excerpt(h,/garden|courtyard|terrace|patio|jard[ií]n|terraz|plot|jardin|terrass|garten|hof|tuin|binnenplaats/i),h=>excerpt(h,/water|electric|agua|agua|strom|wasser|eau|électri|elektr/i),h=>homeCopy(h).description.replace(/\s*Source:\s*tucueva\.com[^\n]*/gi,'')||c[13]];
$('comparison').innerHTML='<table><thead><tr><th scope="col">'+esc(c[0])+'</th>'+chosen.map(h=>'<th scope="col">'+(h.main_image_url?'<img src="'+esc(h.main_image_url)+'" alt="'+esc(homeCopy(h).title)+'">':'')+'<h2>'+esc(homeCopy(h).title)+'</h2><button type="button" data-remove="'+esc(key(h))+'">'+esc(c[23])+'</button></th>').join('')+'</tr></thead><tbody>'+fields.map((f,i)=>'<tr><th scope="row">'+esc(c[14+i])+'</th>'+chosen.map(h=>'<td>'+esc(f(h))+'</td>').join('')+'</tr>').join('')+'<tr><th scope="row">'+esc(c[22])+'</th>'+chosen.map(h=>'<td><a href="/?home='+encodeURIComponent(key(h))+'&lang='+encodeURIComponent(lang)+'">'+esc(c[22])+'</a></td>').join('')+'</tr></tbody></table>';
}
function toggle(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<3)selected.push(id);else{$('notice').textContent=copy[lang][12];return}persist();render()}
$('add').onclick=()=>{if($('picker').value)toggle($('picker').value)};$('clear').onclick=()=>{selected=[];persist();render()};$('savedList').onchange=e=>{if(e.target.dataset.home)toggle(e.target.dataset.home)};$('comparison').onclick=e=>{const b=e.target.closest('[data-remove]');if(b)toggle(b.dataset.remove)};
$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem('caveHomesLanguageManual',lang)}catch{}render()};
$('enquire').onclick=()=>window.chsTrack?.('comparison_enquiry_start',{property_count:selected.length});
render();
(async()=>{try{if(!window.supabase)throw Error('Client unavailable');const db=window.supabase.createClient('https://lesgzlhvrlxgtfuocadq.supabase.co','sb_publishable_pPS6fORJPGFcGBIUPcxOxQ_1g4vazyg');const {data,error}=await db.from('properties').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;homes=data||[];selected=[...new Set(selected.map(id=>homes.find(h=>key(h)===id||h.title===id)).filter(Boolean).map(key))].slice(0,3);loaded=true;persist();render()}catch(e){console.warn('Comparison unavailable',e);failed=true;render()}})();
</script>
</body></html>
