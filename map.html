<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Map | Cave Homes Spain</title><meta name="description" content="Explore published cave homes and properties for sale around Baza, Granada and surrounding areas on the Cave Homes Spain property map."><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--green:#183d32;--clay:#b76443;--cream:#f7f2e9;--ink:#24352f;--muted:#6d7772;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.wrap{width:min(1200px,calc(100% - 24px));margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:var(--green);text-decoration:none;font:700 19px Georgia,serif}.brand img{width:58px}.back{font-weight:800;color:var(--green);text-decoration:none}.intro{padding:22px 0 14px}.intro h1{margin:2px 0 5px;font:700 clamp(30px,6vw,48px) Georgia,serif;color:var(--green)}.intro p{margin:0;color:var(--muted)}#map{height:calc(100vh - 190px);min-height:500px;border-top:1px solid var(--line)}.property-pin{display:grid;place-items:center;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--clay);color:#fff;font-weight:900}.property-pin>span{transform:rotate(45deg)}.popup img{width:190px;height:110px;object-fit:cover;border-radius:8px}.popup strong,.popup b{display:block;margin-top:5px}.popup a{display:inline-block;margin-top:8px;color:var(--clay);font-weight:800;text-decoration:none}@media(max-width:600px){header{height:62px}.brand img{width:48px}.intro{padding:14px 0 10px}#map{height:calc(100vh - 150px);min-height:520px}}</style></head><body><header><div class="wrap head"><a class="brand" href="/"><img src="/cave-homes-spain-logo.png" alt="">Cave Homes Spain</a><a class="back" href="/">← Properties</a></div></header><section class="wrap intro"><h1>Property Map</h1><p id="count">Loading published properties…</p></section><div id="map" aria-label="Interactive map of properties for sale"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://lesgzlhvrlxgtfuocadq.supabase.co','sb_publishable_pPS6fORJPGFcGBIUPcxOxQ_1g4vazyg'),map=L.map('map',{scrollWheelZoom:false}).setView([37.50,-2.78],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);const towns={Baza:[37.49,-2.77],Benamaurel:[37.61,-2.70],Caniles:[37.44,-2.72],Guadix:[37.30,-3.14],Huéscar:[37.81,-2.54],Cúllar:[37.58,-2.57],Cullar:[37.58,-2.57],Albox:[37.39,-2.15],Galera:[37.74,-2.55]};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function coords(h,i){if(Number.isFinite(Number(h.latitude))&&Number.isFinite(Number(h.longitude)))return[Number(h.latitude),Number(h.longitude)];const loc=String(h.town||h.location||'').toLowerCase(),key=Object.keys(towns).find(k=>loc.includes(k.toLowerCase())),b=towns[key]||towns.Baza,a=i*137.5*Math.PI/180,d=.0035*(1+i%3);return[b[0]+Math.sin(a)*d,b[1]+Math.cos(a)*d]}async function load(){try{const {data,error}=await db.from('properties').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;const xs=data||[],bounds=[];xs.forEach((h,i)=>{const p=coords(h,i),icon=L.divIcon({className:'',html:'<span class="property-pin"><span>€</span></span>',iconSize:[38,44],iconAnchor:[19,40]});L.marker(p,{icon}).addTo(map).bindPopup('<div class="popup">'+(h.main_image_url?'<img src="'+esc(h.main_image_url)+'" alt="">':'')+'<strong>'+esc(h.title||'Property')+'</strong><b>€'+Number(h.price||0).toLocaleString('en-GB')+'</b><a href="/?home='+encodeURIComponent(h.id)+'">View property →</a></div>');bounds.push(p)});document.getElementById('count').textContent=xs.length?xs.length+' published '+(xs.length===1?'property':'properties')+' shown. Drag and zoom the map to explore.':'No published properties yet.';if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:12})}catch(e){document.getElementById('count').textContent='Properties could not be loaded.'}}load()</script></body></html>
