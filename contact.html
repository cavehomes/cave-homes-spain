<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Cave Homes Spain | Property Enquiries</title><meta name="description" content="Contact Cave Homes Spain about properties for sale, cave homes, viewings, listings, rentals or general questions."><style>:root{--green:#183d32;--clay:#b76443;--cream:#f7f2e9;--ink:#24352f;--muted:#6d7772;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}.wrap{width:min(820px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--green);font:700 20px Georgia,serif}.brand img{width:68px}.hero{padding:48px 0 20px}.hero h1{font:700 clamp(38px,7vw,60px) Georgia,serif;color:var(--green);margin:5px 0 12px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--clay)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-weight:700}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;background:var(--clay);color:#fff;padding:14px 22px;font-weight:800;cursor:pointer}.email{color:var(--green);font-weight:700}.status{margin-top:10px;font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="wrap"><a class="brand" href="/"><img src="/cave-homes-spain-logo.png" alt="">Cave Homes Spain</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">LET'S TALK</div><h1>Have a question?</h1><p>Ask about a property, arranging a viewing, cave living, advertising your home, rentals or anything else about Cave Homes Spain.</p></section><section class="card"><p>You can email us directly at <a class="email" href="mailto:info@cavehomesspain.com">info@cavehomesspain.com</a>, or use the form below.</p><form action="https://formspree.io/f/xjyvpokg" method="POST"><input type="hidden" name="form_type" id="formType" value="General website enquiry"><input type="hidden" name="property" id="propertyInterest" value=""><div class="grid"><div class="field"><label>Your name *</label><input name="name" required autocomplete="name"></div><div class="field"><label>Email *</label><input name="email" type="email" required autocomplete="email"></div><div class="field full"><label>Subject</label><input name="subject" placeholder="How can we help?"></div><div class="field full"><label>Preferred viewing date</label><input name="preferred_viewing_date" type="date"></div><div class="field full"><label>Message *</label><textarea name="message" rows="6" required></textarea></div><div class="field full"><button class="btn" type="submit">Send message</button></div></div></form></section></main><script>const property=new URLSearchParams(location.search).get('property');if(property){document.getElementById('propertyInterest').value=property;document.getElementById('formType').value='Property enquiry';const subject=document.querySelector('input[name="subject"]'),message=document.querySelector('textarea[name="message"]');subject.value='Enquiry about '+property;message.value='Hello, I would like more information about '+property+'.';document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
