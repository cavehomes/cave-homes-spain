<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Cave Homes Spain | Property Enquiries</title>
  <meta name="description" content="Contact Cave Homes Spain about properties for sale, cave homes, viewings, listings, rentals or general questions.">
  <script src="/site-events.js" defer></script>
  <style>
    :root{--green:#183d32;--clay:#b76443;--cream:#f7f2e9;--ink:#24352f;--muted:#6d7772;--line:#ded8cd}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}.wrap{width:min(820px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--green);font:700 20px Georgia,serif}.brand img{width:68px}.hero{padding:48px 0 20px}.hero h1{font:700 clamp(38px,7vw,60px) Georgia,serif;color:var(--green);margin:5px 0 12px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--clay)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-weight:700}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;background:var(--clay);color:#fff;padding:14px 22px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.status{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#e8f3eb;color:#235235;font-weight:700}.status.error{background:#fbe9e5;color:#8b3528}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/"><img src="/cave-homes-spain-logo.png" alt="">Cave Homes Spain</a></div></header>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">LET'S TALK</div><h1>Have a question?</h1><p>Ask about a property, arranging a viewing, cave living, advertising your home, property management or anything else about Cave Homes Spain.</p></section>
    <section class="card">
      <p>Your message will be sent directly to the private Cave Homes Spain Owners app.</p>
      <form id="contactForm">
        <input type="hidden" name="form_type" id="formType" value="General website enquiry">
        <input type="hidden" name="property" id="propertyInterest" value="">
        <div class="grid">
          <div class="field"><label for="contactName">Your name *</label><input id="contactName" name="name" required autocomplete="name"></div>
          <div class="field"><label for="contactEmail">Email *</label><input id="contactEmail" name="email" type="email" required autocomplete="email"></div>
          <div class="field full"><label for="contactPhone">Phone</label><input id="contactPhone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field full"><label for="contactSubject">Subject</label><input id="contactSubject" name="subject" placeholder="How can we help?"></div>
          <div class="field full"><label for="viewingDate">Preferred viewing date</label><input id="viewingDate" name="preferred_viewing_date" type="date"></div>
          <div class="field full"><label for="contactMessage">Message *</label><textarea id="contactMessage" name="message" rows="6" required></textarea></div>
          <div class="field full"><button class="btn" type="submit">Send message</button><div class="status" id="formStatus" role="status" aria-live="polite"></div></div>
        </div>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=window.supabase.createClient('https://lesgzlhvrlxgtfuocadq.supabase.co','sb_publishable_pPS6fORJPGFcGBIUPcxOxQ_1g4vazyg');
    const params=new URLSearchParams(location.search);
    const service=params.get('service');
    const property=params.get('property');
    if(service==='property-management'){
      document.getElementById('formType').value='Property management enquiry';
      document.getElementById('contactSubject').value='Property management enquiry';
      document.getElementById('contactMessage').value='Hello, I would like to ask about property management support for my property.\n\nProperty location: \nServices needed: ';
      const viewingField=document.getElementById('viewingDate').closest('.field');
      if(viewingField)viewingField.style.display='none';
      document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
    }else if(service==='estate-agent'){
      document.getElementById('formType').value='Estate agent partnership enquiry';
      document.getElementById('contactSubject').value='Estate agent partnership enquiry';
      document.getElementById('contactMessage').value='Hello, I would like to discuss advertising our agency properties with Cave Homes Spain.\n\nAgency name: \nAreas covered: \nApproximate number of properties: ';
      const viewingField=document.getElementById('viewingDate').closest('.field');
      if(viewingField)viewingField.style.display='none';
      document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
    }else if(property){
      document.getElementById('propertyInterest').value=property;
      document.getElementById('formType').value='Property enquiry';
      document.getElementById('contactSubject').value='Enquiry about '+property;
      document.getElementById('contactMessage').value='Hello, I would like more information about '+property+'.';
      document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
    }
    document.getElementById('contactForm').addEventListener('submit',async event=>{
      event.preventDefault();
      const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),status=document.getElementById('formStatus'),data=new FormData(form),viewingDate=String(data.get('preferred_viewing_date')||'');
      button.disabled=true;button.textContent='Sending…';status.style.display='none';status.classList.remove('error');
      const message=String(data.get('message')||'')+(viewingDate?'\n\nPreferred viewing date: '+viewingDate:'');
      try{
        const {error}=await db.from('enquiries').insert({name:String(data.get('name')||''),email:String(data.get('email')||''),phone:String(data.get('phone')||''),subject:String(data.get('subject')||data.get('form_type')||'Website enquiry'),message,property_title:String(data.get('property')||''),source:'buyer',status:'new'});
        if(error)throw error;
        const formType=String(data.get('form_type')||'General website enquiry');
        window.chsTrack?.(formType==='Property enquiry'?'property_enquiry_submitted':formType==='Estate agent partnership enquiry'?'estate_agent_enquiry_submitted':'contact_form_submitted',{form_type:formType,property_title:String(data.get('property')||'')});
        form.reset();
        status.textContent='Thank you—your message has been sent to Cave Homes Spain.';
        status.style.display='block';
      }catch(error){
        console.error('Enquiry could not be saved',error);
        status.textContent='Sorry, your message could not be sent. Please try again.';
        status.classList.add('error');status.style.display='block';
      }finally{button.disabled=false;button.textContent='Send message'}
    });
  </script>
</body>
</html>
