<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advertise your Holiday Rental | Cave Homes Spain</title><meta name="description" content="Submit your Holiday Rental to Cave Homes Spain for approval.">
  <script src="/site-tools.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--ink:#203129;--forest:#29483a;--clay:#b85f3b;--cream:#fffaf2;--muted:#6d746f;--line:#dfd8cc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}a{color:inherit}.wrap{width:min(900px,calc(100% - 36px));margin:auto}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.head{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 1.25rem Georgia,serif;text-decoration:none}.back{font-weight:700;text-decoration:none}.hero{padding:62px 0 24px}.eyebrow{margin:0 0 8px;color:var(--clay);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:0 0 12px;font:700 clamp(2.3rem,6vw,4.5rem)/1.05 Georgia,serif}.hero p{max-width:650px;color:var(--muted);font-size:1.05rem}.formwrap{margin:20px auto 48px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(31,59,48,.08)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:grid;gap:5px;font-weight:700}.formgrid .full{grid-column:1/-1}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--clay);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.status{margin-top:12px;font-weight:700}footer{padding:28px 0;background:var(--forest);color:#fff}@media(max-width:760px){.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}
  </style>
</head>
<body>
  <header><div class="wrap head"><a class="brand" href="/">Cave Homes Spain</a><a class="back" href="/holiday-stays.html">← Holiday Rentals</a></div></header>
  <main><section class="hero"><div class="wrap"><p class="eyebrow">Holiday Rental owners</p><h1>Advertise your Holiday Rental</h1><p>Send your accommodation details and up to four photographs for approval before it appears publicly.</p></div></section>
    <div class="wrap formwrap"><h2>Holiday Rental details</h2><form id="stayForm"><div class="formgrid">
      <label>Your name *<input name="owner_name" required autocomplete="name"></label><label>Holiday Rental name *<input name="rental_name" required></label><label>Address *<input name="location" required></label><label>Telephone *<input name="phone" required type="tel" autocomplete="tel"></label><label>Email *<input name="email" required type="email" autocomplete="email"></label><label>Website *<input name="website" required type="url" placeholder="https://"></label><label class="full">Description *<textarea name="description" rows="5" required></textarea></label><label class="full">Photographs (up to 4) *<input name="photo" type="file" accept="image/*" required multiple></label>
    </div><br><button class="btn" type="submit">Send for approval</button><div class="status" id="status" role="status" aria-live="polite"></div></form></div>
  </main>
  <footer><div class="wrap">© <span id="year"></span> Cave Homes Spain · <a href="/holiday-stays.html">Back to Holiday Rentals</a></div></footer>
  <script>
    document.getElementById('year').textContent=new Date().getFullYear();
    const db=window.supabase.createClient('https://lesgzlhvrlxgtfuocadq.supabase.co','sb_publishable_pPS6fORJPGFcGBIUPcxOxQ_1g4vazyg'),stayForm=document.getElementById('stayForm'),stayStatus=document.getElementById('status');
    const readPhoto=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
    stayForm.onsubmit=async event=>{event.preventDefault();const button=stayForm.querySelector('button[type="submit"]'),data=new FormData(stayForm),photos=[...stayForm.querySelector('[name="photo"]').files];stayStatus.textContent='';if(photos.length>4){stayStatus.textContent='Please choose no more than 4 photographs.';return}button.disabled=true;button.textContent='Sending…';window.chsTrack?.('holiday_rental_submission_attempt',{page_path:location.pathname});try{const details={name:String(data.get('rental_name')||''),owner_name:String(data.get('owner_name')||''),location:String(data.get('location')||''),phone:String(data.get('phone')||''),email:String(data.get('email')||''),website:String(data.get('website')||''),description:String(data.get('description')||''),photos_data:await Promise.all(photos.map(readPhoto))};const {error}=await db.from('enquiries').insert({name:details.owner_name,email:details.email,phone:details.phone,subject:'Holiday Rental application: '+details.name,message:'HOLIDAY_RENTAL_APPLICATION:'+JSON.stringify(details),property_title:details.name,source:'seller',status:'new'});if(error)throw error;const tracking={form_type:'Holiday Rental application',rental_name:details.name};window.chsTrack?.('holiday_rental_submission_submitted',tracking);window.chsTrackLead?.(tracking);stayForm.reset();stayStatus.textContent='Thank you. Your Holiday Rental has been sent for approval.'}catch(error){console.error(error);window.chsTrack?.('enquiry_submit_error',{form_type:'Holiday Rental application'});stayStatus.textContent='The Holiday Rental could not be sent. Please email info@cavehomesspain.com.'}finally{button.disabled=false;button.textContent='Send for approval'}};
  </script>
</body>
</html>
