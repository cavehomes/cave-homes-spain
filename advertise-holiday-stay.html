<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advertise your Holiday Rental | Cave Homes Spain</title><meta name="description" content="Submit your Holiday Rental to Cave Homes Spain for approval."><style>:root{--ink:#203129;--forest:#29483a;--clay:#b85f3b;--cream:#fffaf2;--white:#fff;--muted:#6d746f;--line:#dfd8cc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}a{color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-family:Georgia,serif;font-weight:700;font-size:1.25rem;text-decoration:none}.back{font-weight:700;text-decoration:none}.hero{padding:62px 0 30px}.eyebrow{color:var(--clay);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}.hero h1{font:700 clamp(2.3rem,6vw,4.5rem)/1.05 Georgia,serif;margin:0 0 12px}.hero p{max-width:650px;color:var(--muted);font-size:1.05rem}.advertise{margin:20px auto 42px;padding:22px;background:var(--forest);color:#fff;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}.advertise h2{margin:0 0 5px;font:700 1.6rem Georgia,serif}.advertise p{margin:0;opacity:.85}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--clay);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:65px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(31,59,48,.08);position:relative}.card.featured{border:2px solid #b85f3b;box-shadow:0 18px 42px rgba(184,95,59,.20);transform:translateY(-3px)}.featured-badge{position:absolute;top:12px;left:12px;z-index:2;background:#b85f3b;color:#fff;border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.card img{width:100%;height:220px;object-fit:cover}.card.featured img{height:245px}.body{padding:18px}.body>span{color:var(--clay);font-size:.78rem;font-weight:900;text-transform:uppercase}.card h3{font:700 1.45rem Georgia,serif;margin:5px 0}.desc{color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.desc.expanded{display:block}.more{border:0;background:none;padding:0;margin:0 0 14px;color:var(--clay);font-weight:800;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions a{font-weight:700;font-size:.9rem}.card.featured .actions a:last-child{display:inline-flex;background:#b85f3b;color:#fff;text-decoration:none;border-radius:999px;padding:9px 14px}footer{background:var(--forest);color:#fff;padding:28px 0}.formwrap{display:none;margin:0 auto 42px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.formwrap.open{display:block}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:grid;gap:5px;font-weight:700}.formgrid .full{grid-column:1/-1}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.status{margin-top:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.advertise{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}</style></head><body><header><div class="wrap head"><a class="brand" href="/">Cave Homes Spain</a><a class="back" href="/holiday-stays.html">← Holiday Rentals</a></div></header><main><section class="hero"><div class="wrap"><p class="eyebrow">Holiday Rental owners</p><h1>Advertise your Holiday Rental</h1><p>Send your accommodation details and one or two photographs for approval before it appears publicly.</p></div></section><div class="wrap formwrap open" id="formWrap"><h2>Advertise your Holiday Rental</h2><form id="stayForm"><div class="formgrid"><label>Your name *<input name="owner_name" required></label><label>Holiday Rental name *<input name="rental_name" required></label><label>Address *<input name="location" required></label><label>Telephone *<input name="phone" required type="tel"></label><label>Email *<input name="email" required type="email"></label><label>Website *<input name="website" required type="url" placeholder="https://"></label><label class="full">Description *<textarea name="description" rows="5" required></textarea></label><label class="full">One or two photographs *<input name="photo" type="file" accept="image/*" required multiple></label></div><br><button class="btn" type="submit">Send for approval</button><div class="status" id="status"></div></form></div>
</main><footer><div class="wrap">© <span id="year"></span> Cave Homes Spain · <a href="/holiday-stays.html">Back to Holiday Rentals</a></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('stayForm').onsubmit=e=>{e.preventDefault();document.getElementById('status').textContent='Holiday Rental submissions are still handled through the main site while we complete this page move. Please use the main site Advertise menu for now.'}</script></body></html>
